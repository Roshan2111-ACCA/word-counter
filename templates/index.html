<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Word Counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 620px;
      height: fit-content;
    }

    h1 {
      font-size: 1.8rem;
      color: #1a202c;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #718096;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    textarea {
      width: 100%;
      height: 180px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      resize: vertical;
      transition: border-color 0.2s;
      outline: none;
    }

    textarea:focus {
      border-color: #667eea;
    }

    button {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #5a67d8;
    }

    .results {
      margin-top: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .stat {
      background: #f7fafc;
      border-radius: 8px;
      padding: 18px;
      text-align: center;
    }

    .stat .number {
      font-size: 2rem;
      font-weight: 700;
      color: #667eea;
    }

    .stat .label {
      font-size: 0.8rem;
      color: #718096;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat.wide {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Word Counter</h1>
    <p class="subtitle">Paste or type any text below to analyse it.</p>

    <form method="POST">
      <textarea name="text" placeholder="Type or paste your text here...">{{ text }}</textarea>
      <button type="submit">Analyse</button>
    </form>

    {% if results %}
    <div class="results">
      <div class="stat">
        <div class="number">{{ results.words }}</div>
        <div class="label">Words</div>
      </div>
      <div class="stat">
        <div class="number">{{ results.chars_with_spaces }}</div>
        <div class="label">Characters</div>
      </div>
      <div class="stat">
        <div class="number">{{ results.chars_without_spaces }}</div>
        <div class="label">Chars (no spaces)</div>
      </div>
      <div class="stat wide">
        <div class="number">{{ results.most_common }}</div>
        <div class="label">Most common word</div>
      </div>
    </div>
    {% endif %}
  </div>
</body>
</html>
